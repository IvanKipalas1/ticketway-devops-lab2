
name: TicketWay CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: ticketway_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:secret@localhost:5433/ticketway_test
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          python -m pytest tests/ -v

  selenium:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET_KEY: ticketway-ci-testing-secret-key-2026-abcdef123456

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Selenium and pytest
        run: |
          python -m pip install --upgrade pip
          pip install selenium pytest

      - name: Start TicketWay
        run: |
          docker compose up -d --build

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not start"
          docker compose logs
          exit 1

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not start"
          docker compose logs
          exit 1

      - name: Create test event
        run: |
          docker compose exec -T db psql -U postgres -d ticketway -v ON_ERROR_STOP=1 -c "
          INSERT INTO events
          (id, title, description, location, event_date, price, total_seats)
          VALUES
          (1, 'TicketWay Test Concert', 'CI test event',
          'Kyiv', '2027-06-01 18:00:00', 500, 500);
          "

      - name: Run Selenium tests
        env:
          CI: "true"
        run: |
          python -m pytest tests/selenium/test_frontend.py -v

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v
