apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-myapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-myapp
  template:
    metadata:
      labels:
        app: vault-myapp
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "myapp"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/myapp/config"
    spec:
      serviceAccountName: myapp-sa
      containers:
        - name: app
          image: nginx
          command: ["/bin/sh", "-c"]
          args: ["cat /vault/secrets/config && sleep 3600"]