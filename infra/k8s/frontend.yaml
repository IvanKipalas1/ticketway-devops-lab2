apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketway-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticketway-frontend
  template:
    metadata:
      labels:
        app: ticketway-frontend
    spec:
      containers:
        - name: frontend
          image: ticketway-frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ticketway-frontend
spec:
  selector:
    app: ticketway-frontend
  ports:
    - port: 80
      targetPort: 80
